name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (golden-vector parity with the Python reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test :core
        run: ./gradlew :core:test --stacktrace

  android:
    name: android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promptbeast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: emulator (launch the app + parity self-test on Android 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace || echo failed > fail.flag
            adb pull /sdcard/Android/data/app.promptbeast/files/shots shots || true
            test ! -f fail.flag
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptbeast-screenshots
          path: shots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promptbeast-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
